# `automap` without the translate step: the source term is searched as is. For source lists that
# are already in English, where translating would only add an LLM call per term.
name: automap_original
description: automap without translation - earlier mappings → source code → exact name/synonym → vector search → LLM rerank → confidence gate
entry: extract_atc7
nodes:
  extract_atc7:
    uses: extract_atc7
  match_previous:
    uses: match_previous
    routes: { matched: gate, next: match_code }
  match_code:
    uses: match_code
    routes: { matched: gate, next: match_name }
  match_name:
    uses: match_name
    routes: { matched: gate, next: retrieve }
  retrieve:
    uses: retrieve
    params: { k: 30 }
  rerank:
    uses: llm_rerank
  gate:
    uses: confidence_gate
    routes: { accept: END, reject: END }
edges:
  - [extract_atc7, match_previous]
  - [retrieve, rerank]
  - [rerank, gate]
