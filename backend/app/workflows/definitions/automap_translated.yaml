# `automap` with a translation step: the source term is rendered in English OMOP wording; the
# exact name match, the searches and the reranker use both the original and the English term.
name: automap_translated
description: earlier mappings → source code → translate → exact name/synonym → vector+keyword search (original + English) → LLM rerank → gate
entry: extract_atc7
nodes:
  extract_atc7:
    uses: extract_atc7
  match_previous:
    uses: match_previous
    routes: { matched: gate, next: match_code }
  match_code:
    uses: match_code
    routes: { matched: gate, next: translate }
  translate:
    uses: translate
  match_name:
    uses: match_name
    routes: { matched: gate, next: retrieve }
  retrieve:
    uses: retrieve
    params: { k_default: 15, k_drug: 30 }
  rerank:
    uses: llm_rerank
  gate:
    uses: confidence_gate
    routes: { accept: END, reject: END }
edges:
  - [extract_atc7, match_previous]
  - [translate, match_name]
  - [retrieve, rerank]
  - [rerank, gate]
