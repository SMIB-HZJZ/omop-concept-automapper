# Drugs: deterministic steps first, the similarity pipeline only as a fallback.
# 1. extract_atc7    ATC7 code from the source value (used by the fallback search)
# 2. match_previous  reviewed mapping of the same name; match_code: source code -> Maps to
# 3. match_drug      structure from the CSV columns, or parsed from the name by the LLM, matched on
#                    drug_strength (brand, ingredients, strengths, dose form). A unique match is
#                    accepted with confidence 10; ties go to the reranker as the first candidates.
# 4. fallback        exact name/synonym → translate (+ exact name of the English term) → vector
#                    search → LLM rerank → gate
# 5. when not confident: rewritten searches + a second LLM pick, then an agent retry (it may filter
#    by ATC7 and walks the hierarchy); each replaces the pick only when it is more confident;
#    last, the stronger model decides once more on every candidate and verdict gathered
name: automap_drug
description: drugs - earlier mappings → source code → structured drug_strength match (brand, ingredients, strength, form), else translated search + LLM rerank, when not confident, rewritten searches + second LLM pick, then agent retry, then a final decision on all evidence
entry: extract_atc7
nodes:
  extract_atc7:
    uses: extract_atc7
  match_previous:
    uses: match_previous
    routes: { matched: gate, next: match_code }
  match_code:
    uses: match_code
    routes: { matched: gate, next: match_drug }
  match_drug:
    uses: match_drug
    routes: { matched: gate, fallback: match_name }
  match_name:
    uses: match_name
    params: { term: original }
    routes: { matched: gate, next: translate }
  translate:
    uses: translate
  match_english:
    uses: match_name
    params: { term: english }
    routes: { matched: gate, next: retrieve }
  retrieve:
    uses: retrieve
    params: { k: 30 }
  rerank:
    uses: llm_rerank
  gate:
    uses: confidence_gate
    routes: { accept: END, reject: rewrite }
  rewrite:
    uses: rewrite_search
    routes: { rerank: rerank_again, skip: refine }
  rerank_again:
    uses: llm_rerank
    params: { keep_better: true, escalate: false, context_top: 10 }
  gate_again:
    uses: confidence_gate
    routes: { accept: END, reject: refine }
  refine:
    uses: agentic_refine
  final_gate:
    uses: confidence_gate
    routes: { accept: END, reject: decide }
  decide:
    uses: decide_with_evidence
  last_gate:
    uses: confidence_gate
    routes: { accept: END, reject: END }
edges:
  - [extract_atc7, match_previous]
  - [translate, match_english]
  - [retrieve, rerank]
  - [rerank, gate]
  - [rerank_again, gate_again]
  - [refine, final_gate]
  - [decide, last_gate]
