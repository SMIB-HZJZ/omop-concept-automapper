# Default mapping pipeline. Deterministic steps first; the search + LLM only for what is left:
# 1. extract_atc7    ATC7 code from the source value (drug mode; narrows the drug search)
# 2. match_previous  the reviewed mapping of another source concept with the same name
# 3. match_code      the source code in the vocabulary's code systems (e.g. ICD10) -> Maps to
# 4. match_name      exact name or synonym of a concept (case/accents ignored) -> Maps to
# 5. retrieve        vector + keyword search, rank fusion
# 6. rerank          the LLM picks the best candidate (similar reviewed mappings as examples)
# 7. gate            accept if the confidence reaches the threshold
name: automap
description: earlier mappings → source code → exact name/synonym → vector+keyword search → LLM rerank → confidence gate
entry: extract_atc7
nodes:
  extract_atc7:
    uses: extract_atc7
  match_previous:
    uses: match_previous
    routes: { matched: gate, next: match_code }
  match_code:
    uses: match_code
    routes: { matched: gate, next: match_name }
  match_name:
    uses: match_name
    routes: { matched: gate, next: retrieve }
  retrieve:
    uses: retrieve
    params: { k_default: 15, k_drug: 30 }
  rerank:
    uses: llm_rerank
  gate:
    uses: confidence_gate
    routes: { accept: END, reject: END }
edges:
  - [extract_atc7, match_previous]
  - [retrieve, rerank]
  - [rerank, gate]
