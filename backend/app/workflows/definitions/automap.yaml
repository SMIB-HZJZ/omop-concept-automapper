# Reproduces the Streamlit app's auto-mapping:
# ATC7 extraction (drug mode) -> vector retrieval -> LLM rerank -> confidence threshold
name: automap
description: ATC7 extraction → vector retrieval → LLM rerank → confidence gate
entry: extract_atc7
nodes:
  extract_atc7:
    uses: extract_atc7
  retrieve:
    uses: retrieve
    params: { k_default: 15, k_drug: 30 }
  rerank:
    uses: llm_rerank
  gate:
    uses: confidence_gate
    routes: { accept: END, reject: END }
edges:
  - [extract_atc7, retrieve]
  - [retrieve, rerank]
  - [rerank, gate]
