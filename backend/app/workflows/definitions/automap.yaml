# Default mapping pipeline. Deterministic steps first; the search + LLM only for what is left:
# 1. extract_atc7    ATC7 code from the source value (drug mode; narrows the drug search)
# 2. match_previous  the reviewed mapping of another source concept with the same name
# 3. match_code      the source code in the vocabulary's code systems (e.g. ICD10) -> Maps to
# 4. translate       the term in English OMOP wording (cached per term; skipped if already English)
# 5. match_name      exact name or synonym of the original or English term -> Maps to
# 6. retrieve        vector search for the original and the English term, merged
#                    (keyword fusion optional: params { keyword: true })
# 7. rerank          the LLM picks the best candidate, seeing both terms (similar reviewed
#                    mappings as examples)
# 8. gate            accept if the confidence reaches the threshold; otherwise
# 9. rewrite         the LLM writes up to 3 other searches (abbreviations spelled out, synonyms,
#                    OMOP wording); new candidates go to
# 10. rerank_again   a second LLM pick, kept only when more confident than the first; gate_again
# 11. refine         still not confident: an agent searches with its own wording and walks the
#                    hierarchy (limited by AGENT_REQUEST_LIMIT); kept only when more confident
# 12. final_gate     the same threshold; still not confident:
# 13. decide         the stronger model gets every candidate found (first search, rewritten
#                    searches, the agent's finds) and every earlier verdict, and makes one final
#                    choice (method auto_final); then
# 14. last_gate      the same threshold decides
# Searching original + English was the largest gain in the retrieval evaluation (noisy Croatian:
# R@1 0.42 -> 0.66, R@30 0.90 -> 0.97); see docs/retrieval-evaluation-2026-11.md.
name: automap
description: earlier mappings → source code → translate → exact name/synonym → vector search (original + English) → LLM rerank → confidence gate; when not confident, rewritten searches + second LLM pick, then agent retry, then a final decision on all evidence
entry: extract_atc7
nodes:
  extract_atc7:
    uses: extract_atc7
  match_previous:
    uses: match_previous
    routes: { matched: gate, next: match_code }
  match_code:
    uses: match_code
    routes: { matched: gate, next: translate }
  translate:
    uses: translate
  match_name:
    uses: match_name
    routes: { matched: gate, next: retrieve }
  retrieve:
    uses: retrieve
    params: { k: 30 }
  rerank:
    uses: llm_rerank
  gate:
    uses: confidence_gate
    routes: { accept: END, reject: rewrite }
  rewrite:
    uses: rewrite_search
    routes: { rerank: rerank_again, skip: refine }
  rerank_again:
    uses: llm_rerank
    params: { keep_better: true }
  gate_again:
    uses: confidence_gate
    routes: { accept: END, reject: refine }
  refine:
    uses: agentic_refine
  final_gate:
    uses: confidence_gate
    routes: { accept: END, reject: decide }
  decide:
    uses: decide_with_evidence
  last_gate:
    uses: confidence_gate
    routes: { accept: END, reject: END }
edges:
  - [extract_atc7, match_previous]
  - [translate, match_name]
  - [retrieve, rerank]
  - [rerank, gate]
  - [rerank_again, gate_again]
  - [refine, final_gate]
  - [decide, last_gate]
