# Same as `automap`, but low-confidence results get a second chance from a tool-using agent
name: automap_refine
description: automap, then a Pydantic AI agent retries rejected concepts with query reformulation
entry: extract_atc7
nodes:
  extract_atc7:
    uses: extract_atc7
  match_previous:
    uses: match_previous
    routes: { matched: final_gate, next: match_code }
  match_code:
    uses: match_code
    routes: { matched: final_gate, next: match_name }
  match_name:
    uses: match_name
    routes: { matched: final_gate, next: retrieve }
  retrieve:
    uses: retrieve
    params: { k: 30 }
  rerank:
    uses: llm_rerank
  gate:
    uses: confidence_gate
    routes: { accept: END, reject: refine }
  refine:
    uses: agentic_refine
  final_gate:
    uses: confidence_gate
    routes: { accept: END, reject: END }
edges:
  - [extract_atc7, match_previous]
  - [retrieve, rerank]
  - [rerank, gate]
  - [refine, final_gate]
