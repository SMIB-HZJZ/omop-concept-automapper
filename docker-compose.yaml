name: omop-automapper

# Secrets are split by who needs them:
#   .env          app settings (DB, Redis, JWT, admin, LiteLLM master key, models): backend + worker
#   .env.litellm  LLM provider API keys: litellm only
# PostgreSQL only receives its POSTGRES_* variables (interpolated from .env below).

x-backend-env: &backend-env
  POSTGRES_HOST: postgres-db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-http://litellm:4000}
  UPLOAD_DIR: /data/uploads
  VOCABULARY_UPLOAD_MAX_MB: ${VOCABULARY_UPLOAD_MAX_MB:-20480}
  # Only the compose network (i.e. the nginx frontend) may set X-Forwarded-For
  FORWARDED_ALLOW_IPS: ${APP_SUBNET:-172.29.250.0/24}

services:
  # PostgreSQL 18 with pgvector + pgvectorscale (StreamingDiskANN) preinstalled
  postgres-db:
    image: timescale/timescaledb-ha:pg18.6-ts2.30.2
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-auto_mapper}
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=${PG_WORK_MEM:-32MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-1GB}
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-4GB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-200}
    # Parallel index builds use /dev/shm: keep it above maintenance_work_mem and
    # DISKANN_MAINTENANCE_WORK_MEM, or DiskANN builds fail
    shm_size: ${PG_SHM_SIZE:-2g}
    volumes:
      - pgdata18:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.9-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # LiteLLM proxy: the only service holding LLM provider keys
  litellm:
    image: ghcr.io/berriai/litellm:v1.104.0
    restart: unless-stopped
    env_file:
      - path: .env.litellm
        required: true
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: omop-automapper-backend
    restart: unless-stopped
    env_file: .env
    environment: *backend-env
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    image: omop-automapper-backend
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *backend-env
      SKIP_DB_INIT: "1"
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=${CELERY_CONCURRENCY:-2}"]
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    # Same image as the API: replace its HTTP healthcheck with a Celery ping
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-8501}:80"
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    ipam:
      config:
        # Fixed so the backend can trust X-Forwarded-For from this network only (FORWARDED_ALLOW_IPS).
        # Change APP_SUBNET if it collides with another network on the host.
        - subnet: ${APP_SUBNET:-172.29.250.0/24}

volumes:
  pgdata18:
  redis_data:
  uploads:
