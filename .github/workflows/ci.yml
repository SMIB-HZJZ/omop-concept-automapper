name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      # Same image as docker-compose.yaml: PostgreSQL 18 with pgvector + pgvectorscale
      postgres:
        image: timescale/timescaledb-ha:pg18.6-ts2.30.2
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4.9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Read by backend/tests/conftest.py (it creates and drops its own database)
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.5"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
      - name: OpenAPI schema is up to date
        run: |
          APP_ENV=dev uv run python scripts/export_openapi.py
          git diff --exit-code -- ../frontend/openapi.json || {
            echo "::error::frontend/openapi.json is stale: run scripts/export_openapi.py and npm run gen:api"
            exit 1
          }

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generated API types match openapi.json
        run: npm run check:api
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compose files are valid
        run: |
          cp .env.example .env
          cp .env.litellm.example .env.litellm
          docker compose -f docker-compose.yaml config -q
          docker compose -f docker-compose.dev.yaml config -q
      - name: Build images
        run: docker compose -f docker-compose.yaml build
