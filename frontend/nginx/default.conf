server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # CSV uploads (source concepts) can be large; the backend enforces 500 MB itself
    client_max_body_size 512m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/plain text/csv application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Shared proxy settings for /api. X-Forwarded-For is overwritten (not appended) with the
    # address nginx sees, so clients cannot inject their own; the backend trusts it only from
    # this network (FORWARDED_ALLOW_IPS). Behind another reverse proxy, configure real_ip here.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        # Large CSV exports stream straight through
        proxy_buffering off;
    }

    # Athena vocabulary zips are several GB; the backend enforces VOCABULARY_UPLOAD_MAX_MB
    location = /api/vocabulary/import {
        client_max_body_size 0;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # AI suggest runs a whole LLM workflow inline (with retries), so allow it more time
    location ~ ^/api/source-concepts/[0-9]+/suggest$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed file names, so assets can be cached forever
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
