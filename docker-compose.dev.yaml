# Development stack: hot reload for API, worker and frontend, plus pgAdmin.
#   docker compose -f docker-compose.dev.yaml up --build
name: omop-automapper-dev

x-backend-env: &backend-env
  APP_ENV: dev
  LOG_FORMAT: text
  POSTGRES_HOST: postgres-db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-http://litellm:4000}
  VOCABULARY_DIR: /data/vocabulary
  UPLOAD_DIR: /data/uploads
  CORS_ORIGINS: http://localhost:5173

services:
  postgres-db:
    image: timescale/timescaledb-ha:pg18.6-ts2.30.2
    restart: always
    env_file: .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "maintenance_work_mem=512MB", "-c", "shared_buffers=512MB"]
    shm_size: 512m
    ports:
      - "5455:5432"
    volumes:
      - pgdata18:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:v1.104.0
    env_file: .env
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro

  # OpenAI-compatible stand-in for the LiteLLM proxy, for running without provider keys.
  #   docker compose -f docker-compose.dev.yaml --profile fake-llm up -d fake-llm
  #   and set LLM_GATEWAY_URL=http://fake-llm:4000 (e.g. in .env) before starting backend/worker.
  fake-llm:
    image: omop-automapper-backend-dev
    profiles: ["fake-llm"]
    environment:
      SKIP_DB_INIT: "1"
    command: ["uvicorn", "tests.fake_llm.server:app", "--host", "0.0.0.0", "--port", "4000"]
    volumes:
      - ./backend:/app/backend
      - /app/backend/.venv

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres-db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        UV_EXTRA_ARGS: ""
    image: omop-automapper-backend-dev
    env_file: .env
    environment: *backend-env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/backend/app"]
    ports:
      - "8000:8000"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - /app/backend/.venv
      - ./examples:/app/examples
      - ./vocabulary:/data/vocabulary:ro
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  worker:
    image: omop-automapper-backend-dev
    env_file: .env
    environment:
      <<: *backend-env
      SKIP_DB_INIT: "1"
    command: ["watchfiles", "--filter", "python", "celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=2", "/app/backend/app"]
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - /app/backend/.venv
      - ./examples:/app/examples
      - ./vocabulary:/data/vocabulary:ro
      - uploads:/data/uploads

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"]
    environment:
      VITE_API_PROXY: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata18:
  pgadmin_data:
  uploads:
  frontend_node_modules:
