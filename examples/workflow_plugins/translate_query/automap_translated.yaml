# The default automap pipeline with the custom `translate_query` step inserted before retrieval.
# Nothing in the core changes: the step comes from the plugin module, the wiring from this file.
name: automap_translated
description: translate the source term to English, then ATC7 → retrieval → LLM rerank → gate
entry: extract_atc7
nodes:
  extract_atc7:
    uses: extract_atc7
  translate:
    uses: translate_query
  retrieve:
    uses: retrieve
    params: { k_default: 15, k_drug: 30 }
  rerank:
    uses: llm_rerank
  gate:
    uses: confidence_gate
    routes: { accept: END, reject: END }
edges:
  - [extract_atc7, translate]
  - [translate, retrieve]
  - [retrieve, rerank]
  - [rerank, gate]
